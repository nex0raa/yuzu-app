name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check generated language tables
        run: python3 scripts/generate-localizations.py --check
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Scan full public history for secrets
        run: python3 scripts/scan-secrets.py
  mac-source:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Build native macOS app
        run: swift build --product Yuzu
      - name: Isolated native UI, accessibility and artwork checks
        run: python3 scripts/test-native-ui.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-native-ui
          path: build/native-ui
          retention-days: 7
          if-no-files-found: warn
      - name: Archive link boundary and extraction regressions
        run: swift test --filter 'ArchiveLinkBoundaryTests|ArchiveResourceLimitsTests|DocumentEngineTests/testArchive|DocumentEngineTests/testZIPTARGZIPRoundTripsNestedFilesAndUnicodeWithoutOverwritingOriginals|DocumentEngineTests/testStoredRARAndOrdinaryGZIPAreReadable|DocumentEngineTests/testCancellationProducesNoPublishedDocumentOrExtractedFolder'
      - name: Update trust, web photo and window placement and setup regressions
        run: swift test --filter 'NashiUpdatesTests|WebMediaDragPayloadTests|InstagramPhotosTests|YouTubeThumbnailTests|WindowPlacementTests|AppLocalizationTests|ToolSetupTests'
      - name: HTML to PDF layout, offline isolation and cancellation
        run: swift test --filter HTMLToPDFTests
      - name: Install FFmpeg for redaction regressions
        run: brew install ffmpeg
      - name: Redaction coverage and image opacity regressions
        run: swift test --filter 'SolidRedactionCoverageTests|ImageRedactionBoundsRegressionTests|ImageColorOpacityRegressionTests|MediaEngineTests/testVideoRedactionStylesAndTemporalBounds'
  mac-package-launch:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install ExifTool
        run: scripts/setup-exiftool.sh
      - name: Package the app like a public release
        env:
          NASHI_UPDATE_CONFIG: Configuration/Updates.public.plist
          NASHI_APP_OUTPUT: ${{ runner.temp }}/package/Yuzu.app
        run: |
          swift package resolve
          scripts/build-app.sh release
      - name: Launch it with the build folder out of reach
        run: |
          app="$RUNNER_TEMP/package/Yuzu.app"
          mv .build "$RUNNER_TEMP/build-hidden"
          open "$app"; sleep 15
          if ! pgrep -f "$app/Contents/MacOS/Yuzu" >/dev/null; then
            echo "Yuzu quit right after launch."
            log show --last 1m --predicate 'process == "Yuzu"' --style compact | grep -i "fatal\|error" | tail -20
            exit 1
          fi
          pkill -f "$app/Contents/MacOS/Yuzu" || true
          echo "Packaged Yuzu launched and kept running."
