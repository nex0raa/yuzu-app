name: Release Yuzu
# Builds the macOS app on GitHub's Mac runners and publishes it as a release.
# Start it from Actions → "Release Yuzu" → Run workflow, or push a tag such as v1.0.0-1.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 1.0.0'
        required: true
      build:
        description: 'Build number, must grow every release (1, 2, 3...)'
        required: true
  push:
    tags: ['v*.*.*-*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  mac-release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Work out version and build number
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then version=$INPUT_VERSION; build=$INPUT_BUILD
          else tag=${REF_NAME#v}; version=${tag%-*}; build=${tag##*-}; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$build" =~ ^[0-9]+$ ]] || { echo "Use a version like 1.0.0 and a numeric build"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Check the update feed points at this repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          configured=$(plutil -extract PublicRepository raw -o - Configuration/Updates.public.plist)
          if [[ "$configured" != "$REPOSITORY" ]]; then
            echo "Configuration/Updates.public.plist names $configured but this repository is $REPOSITORY."; exit 1
          fi
      - name: Install ExifTool
        run: scripts/setup-exiftool.sh
      - name: Resolve Swift packages
        run: swift package resolve
      - name: Build, audit and sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then echo "Add the SPARKLE_PRIVATE_KEY repository secret first."; exit 1; fi
          key_file="$RUNNER_TEMP/sparkle-key"
          umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          NASHI_UPDATE_KEY_FILE="$key_file" scripts/prepare-public-release.sh "$VERSION" "$BUILD"
          rm -f "$key_file"
      - name: Launch the packaged app from the ZIP before publishing
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          check="$RUNNER_TEMP/launch-check"; mkdir -p "$check"
          ditto -x -k "build/public-upload-$VERSION-$BUILD/Yuzu-macOS-arm64.zip" "$check"
          # Move the build folder away so the app cannot fall back to build paths.
          mv .build "$RUNNER_TEMP/build-hidden"
          open "$check/Yuzu.app"; sleep 15
          if ! pgrep -f "$check/Yuzu.app/Contents/MacOS/Yuzu" >/dev/null; then
            echo "Yuzu quit right after launch. Recent crash log:"
            ls -t ~/Library/Logs/DiagnosticReports/Yuzu* 2>/dev/null | head -1 | xargs -I{} head -60 {}
            log show --last 1m --predicate 'process == "Yuzu"' --style compact | grep -i "fatal\|error" | tail -20
            exit 1
          fi
          pkill -f "$check/Yuzu.app/Contents/MacOS/Yuzu" || true
          mv "$RUNNER_TEMP/build-hidden" .build
          echo "Yuzu launched and kept running."
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          upload="build/public-upload-$VERSION-$BUILD"
          (cd "$upload" && shasum -a 256 *.zip > SHA256SUMS.txt)
          tag="v$VERSION-$BUILD"
          notes="Yuzu $VERSION ($BUILD) for Apple Silicon Macs, macOS 13 or later.

          Download Yuzu-macOS-arm64.zip, unzip it, move Yuzu.app to Applications and open it.
          This build is not notarized by Apple: the first time, macOS may block it. Open System Settings → Privacy & Security and choose Open Anyway."
          gh release create "$tag" "$upload"/* --repo "$GITHUB_REPOSITORY" --title "Yuzu $VERSION" --notes "$notes" --target "$GITHUB_SHA"
